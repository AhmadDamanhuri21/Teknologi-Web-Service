openapi: 3.0.3

info:
  title: API WisataKu
  version: 1.0.0
  description: API untuk mengelola data destinasi wisata pada aplikasi WisataKu.

servers:
  - url: http://localhost:3000
    description: Server lokal WisataKu

paths:
  /api/v1/destinasi:
    get:
      summary: Menampilkan daftar destinasi
      description: Mengambil seluruh data destinasi wisata.
      responses:
        '200':
          description: Daftar destinasi berhasil diambil

    post:
      summary: Menambahkan destinasi
      description: Menambahkan data destinasi wisata baru.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nama
                - kategori
                - lokasi
                - deskripsi
                - hargaTiket
              properties:
                nama:
                  type: string
                kategori:
                  type: string
                lokasi:
                  type: string
                deskripsi:
                  type: string
                hargaTiket:
                  type: number
                ratingRata:
                  type: number
      responses:
        '201':
          description: Destinasi berhasil ditambahkan
        '400':
          description: Data yang dikirim tidak valid

  /api/v1/destinasi/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: ID destinasi yang akan diproses
        schema:
          type: integer

    get:
      summary: Menampilkan destinasi berdasarkan ID
      description: Mengambil satu data destinasi berdasarkan ID.
      responses:
        '200':
          description: Data destinasi berhasil diambil
        '404':
          description: Destinasi tidak ditemukan

    put:
      summary: Mengubah data destinasi
      description: Mengubah data destinasi berdasarkan ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nama:
                  type: string
                kategori:
                  type: string
                lokasi:
                  type: string
                deskripsi:
                  type: string
                hargaTiket:
                  type: number
                ratingRata:
                  type: number
      responses:
        '200':
          description: Data destinasi berhasil diperbarui
        '400':
          description: Data yang dikirim tidak valid
        '404':
          description: Destinasi tidak ditemukan

    delete:
      summary: Menghapus destinasi
      description: Menghapus data destinasi berdasarkan ID.
      responses:
        '204':
          description: Destinasi berhasil dihapus
        '404':
          description: Destinasi tidak ditemukan